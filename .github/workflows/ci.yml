name: Phoenix Rest Assured Automation workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule: ## Run job at 6.30 PM for all 365 days. Current timing in UTC
  - cron: "30 18 * * *"
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Execute Rest Assured Test Automation Framework
      run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa
      
    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
          name: Surefire Report
          path: target/surefire-reports/
          retention-days: 10
          
          
          
    
  
