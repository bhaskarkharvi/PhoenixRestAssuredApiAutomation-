name: Phoenix Rest Assured Automation workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule: ## Run job at 6.30 PM for all 365 days. Current timing in UTC
  - cron: "30 18 * * *"
  workflow_dispatch: 
   inputs:
    env:
     description: "Environment"
     type: choice
     options: [qa,uat,dev]
     default: qa
     required: true
    suiteXmlFile:
     description: "testNG.xml file"
     type: choice
     options: [testng.xml,smoke.xml,regression.xml]
     default: testng.xml
     required: true  
jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

     - name: Default value for execution
       id:  default
       run:  |
           echo "suiteXmlFile=$"{{github.event.inputs.suiteXmlFile || 'testng.xml' }}" >>GITHUB_OUTPUT
           echo "env=$"{{github.event.inputs.env || 'qa'}}" 
     - name: Execute Rest Assured Test Automation Framework
     ## run: mvn clean test -DsuiteXmlFile="${{ github.event.inputs.suiteXmlFile }}" -Denv="${{ github.event.inputs.env }}"
       run: mvn clean test -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" -Denv="${{ steps.default.outputs.env }}"
      
    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
          name: Surefire Report
          path: target/surefire-reports/
          retention-days: 10
          
          
          
    
  
